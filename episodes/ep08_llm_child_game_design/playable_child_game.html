<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LunaBat &amp; Friends</title>
  <style>
    :root {
      --bg-cream: #FFFDF7;
      --bg-meadow: #E8F6EF;
      --bg-sky: #E3F4FE;
      --tile-grass: #D4F0E0;
      --tile-grass-border: #A8DFC0;
      --tile-path-hint: #FFF3B0;
      --tile-path-border: #F7D060;
      --tile-stone: #E5E0D5;
      --tile-stone-border: #C4BCAB;
      --coral: #FF7E6B;
      --sunshine: #FFD166;
      --mint: #06D6A0;
      --sky: #4CC9F0;
      --violet: #8B5CF6;
      --card-border: #E6DEC8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: linear-gradient(180deg, var(--bg-sky) 0%, var(--bg-cream) 42%, var(--bg-meadow) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Ultra-gentle floating sky clouds (<= 0.35 px/frame equivalent) */
    .sky-layer {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 140px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .cloud {
      position: absolute;
      opacity: 0.75;
      transition: transform 0.2s linear;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 880px;
      background: var(--bg-cream);
      border: 4px solid var(--card-border);
      border-radius: 32px;
      box-shadow: 0 14px 36px rgba(90, 75, 50, 0.08);
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Control & ZPD Star Bar — 100% pure visual icons, ZERO text */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #FFF9EB;
      border: 3px solid #F3E5AB;
      border-radius: 24px;
      padding: 10px 16px;
      flex-wrap: wrap;
    }

    /* Favorite treat selector (feeds Generative Agents Memory Stream) */
    .treat-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 2.5px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 10px;
    }

    .treat-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: 3px solid transparent;
      background: #FFFDF7;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }
    .treat-btn:hover {
      transform: scale(1.08);
    }
    .treat-btn.selected {
      border-color: var(--coral);
      background: #FFF0ED;
      transform: scale(1.12);
      box-shadow: 0 4px 12px rgba(255, 126, 107, 0.25);
    }

    /* Voyager ZPD 6-Star Sliding Window Meter */
    .zpd-star-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #FFFFFF;
      border: 2.5px solid var(--card-border);
      border-radius: 20px;
      padding: 8px 14px;
    }
    .star-slot {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .star-slot.filled {
      transform: scale(1.15);
    }

    /* Difficulty Tier Pips (1..5 dots) */
    .tier-pips {
      display: flex;
      align-items: center;
      gap: 5px;
      padding-left: 8px;
      border-left: 2px dashed var(--card-border);
    }
    .tier-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #E5DEC9;
      transition: background 0.3s ease, transform 0.3s ease;
    }
    .tier-dot.active {
      background: var(--mint);
      transform: scale(1.2);
    }

    /* Utility Icon Buttons (Audio, Gentle Speed, Freeze Sky) */
    .utility-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-pill-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      border: 3px solid var(--card-border);
      background: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-pill-btn.active {
      border-color: var(--sky);
      background: #EBF8FF;
    }
    .icon-pill-btn:active {
      transform: scale(0.93);
    }

    /* Main Play Area: Board + Companion Column */
    .play-stage {
      display: grid;
      grid-template-columns: 1fr 230px;
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 720px) {
      .play-stage {
        grid-template-columns: 1fr;
      }
    }

    .board-frame {
      background: #F4FBF7;
      border: 4px solid var(--tile-grass-border);
      border-radius: 28px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 390px;
      position: relative;
      overflow: hidden;
    }

    .grid-board {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .grid-row {
      display: flex;
      gap: 10px;
    }

    .tile {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--tile-grass);
      border: 3px solid var(--tile-grass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.28s ease, background 0.28s ease, border-color 0.28s ease;
    }
    @media (max-width: 520px) {
      .tile {
        width: 52px;
        height: 52px;
        border-radius: 15px;
      }
    }
    .tile:hover {
      transform: scale(1.04);
    }
    .tile.walkable-neighbor {
      border-color: #63D297;
      box-shadow: 0 0 0 3px rgba(99, 210, 151, 0.28);
    }
    .tile.tile-wall {
      background: var(--tile-stone);
      border-color: var(--tile-stone-border);
      cursor: default;
    }
    .tile.tile-wall:hover {
      transform: none;
    }
    .tile.tile-hint {
      background: var(--tile-path-hint);
      border-color: var(--tile-path-border);
    }
    .tile.tile-goal {
      background: #FFF0F3;
      border-color: #FF9EBB;
    }
    .tile.tile-player {
      background: #EDE9FE;
      border-color: #A78BFA;
      box-shadow: 0 6px 16px rgba(139, 92, 246, 0.24);
    }

    /* Gentle pulsing animation for LunaBat & Goal (slow 3.2s cycle) */
    @keyframes gentleBreathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.04); }
    }
    .breathe-slow {
      animation: gentleBreathe 3.2s ease-in-out infinite;
    }

    /* Cozy Companion Memory Sidebar (SunnyFox + PoppyDash + Visual Memory Bubbles) */
    .companion-panel {
      background: #FFF9EB;
      border: 3px solid #F3E5AB;
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .companion-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .companion-avatars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .avatar-circle {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #FFFDF7;
      border: 3.5px solid var(--coral);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(255, 126, 107, 0.18);
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .avatar-circle:active {
      transform: scale(0.92);
    }

    /* Pure-Icon Thought Bubble showing Retrieved Memory Stream (ZERO words) */
    .thought-bubble {
      width: 100%;
      min-height: 78px;
      background: #FFFFFF;
      border: 3px solid var(--card-border);
      border-radius: 22px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .thought-bubble::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 10px 12px 10px;
      border-style: solid;
      border-color: transparent transparent var(--card-border) transparent;
    }

    /* Episodic Memory Stream Tray (3 visual slots ranked by S-score) */
    .memory-stream-tray {
      width: 100%;
      background: #FFFDF7;
      border: 2.5px dashed #E2D9C0;
      border-radius: 20px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .memory-slots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .memory-orb {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: #FFFFFF;
      border: 2.5px solid #E6DEC8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.35s ease;
    }
    .memory-orb.top-recalled {
      border-color: var(--sunshine);
      background: #FFFBEB;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(255, 209, 102, 0.35);
    }

    /* Bottom Action Controls: Giant Tactile Picture Buttons + D-Pad */
    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .dpad-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFF9EB;
      border: 3px solid #F3E5AB;
      border-radius: 24px;
      padding: 8px 14px;
    }

    .arrow-btn {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      border: 3.5px solid #E2D5B5;
      background: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 #E2D5B5;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
    }
    .arrow-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #E2D5B5;
      background: #F4FBF7;
    }

    .magic-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .big-icon-btn {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      border: 3.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .big-icon-btn:active {
      transform: translateY(4px);
    }
    .btn-hint {
      background: #FFF3B0;
      border-color: #F2C94C;
      box-shadow: 0 5px 0 #E5B83B;
    }
    .btn-autowalk {
      background: #D8F3DC;
      border-color: #52B788;
      box-shadow: 0 5px 0 #40916C;
    }
    .btn-next {
      background: #FFE5EC;
      border-color: #FF8FAB;
      box-shadow: 0 5px 0 #FB6F92;
    }

    /* Gentle floating celebration balloons (max 3 slow balloons, 0.6 px/frame) */
    .balloon-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .gentle-balloon {
      position: absolute;
      transition: transform 0.1s linear;
    }
  </style>
</head>
<body>

  <!-- Ultra-gentle slow floating clouds in sky -->
  <div class="sky-layer" id="skyLayer">
    <svg class="cloud" id="cloud1" style="top: 18px; left: 8%;" width="110" height="54" viewBox="0 0 110 54" fill="none">
      <path d="M28 46H86C96 46 104 38 104 28C104 19 97 11 88 10C84 4 76 0 67 0C54 0 43 9 41 21C37 19 33 18 28 18C15 18 6 27 6 32C6 40 15 46 28 46Z" fill="#FFFFFF"/>
    </svg>
    <svg class="cloud" id="cloud2" style="top: 42px; left: 62%;" width="130" height="60" viewBox="0 0 110 54" fill="none">
      <path d="M28 46H86C96 46 104 38 104 28C104 19 97 11 88 10C84 4 76 0 67 0C54 0 43 9 41 21C37 19 33 18 28 18C15 18 6 27 6 32C6 40 15 46 28 46Z" fill="#FFFFFF"/>
    </svg>
  </div>

  <div class="app-shell">
    <!-- TOP BAR: Favorite Treat Picker + 6-Star Voyager ZPD Meter + Gentle Controls -->
    <div class="top-bar">
      <!-- Child Picks Favorite Treat -> Stored in Companion Memory Stream (Importance = 10) -->
      <div class="treat-picker" id="treatPicker">
        <button class="treat-btn selected" onclick="selectFavoriteTreat('strawberry', 0)" aria-label="Strawberry">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
            <path d="M18 32C25 32 29 23 29 15C29 10 24 8 18 8C12 8 7 10 7 15C7 23 11 32 18 32Z" fill="#FF5D73" stroke="#C92A42" stroke-width="2.2"/>
            <path d="M13 7C15 4 21 4 23 7C20 9 16 9 13 7Z" fill="#38B000" stroke="#2B7A0B" stroke-width="2"/>
            <circle cx="14" cy="15" r="1.3" fill="#FFF3B0"/>
            <circle cx="22" cy="15" r="1.3" fill="#FFF3B0"/>
            <circle cx="18" cy="20" r="1.3" fill="#FFF3B0"/>
            <circle cx="15" cy="25" r="1.3" fill="#FFF3B0"/>
            <circle cx="21" cy="25" r="1.3" fill="#FFF3B0"/>
          </svg>
        </button>
        <button class="treat-btn" onclick="selectFavoriteTreat('popcorn', 1)" aria-label="Popcorn">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
            <circle cx="13" cy="12" r="5" fill="#FFF3B0" stroke="#E09F3E" stroke-width="2"/>
            <circle cx="23" cy="12" r="5" fill="#FFF3B0" stroke="#E09F3E" stroke-width="2"/>
            <circle cx="18" cy="9" r="5.5" fill="#FFF9DB" stroke="#E09F3E" stroke-width="2"/>
            <path d="M9 15H27L24 31H12L9 15Z" fill="#FF5D73" stroke="#C92A42" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M15 15L16 31M21 15L20 31" stroke="#FFFFFF" stroke-width="3"/>
          </svg>
        </button>
        <button class="treat-btn" onclick="selectFavoriteTreat('star', 2)" aria-label="Crystal Star">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
            <polygon points="18,4 22,13 32,14 24.5,21 26.5,31 18,26 9.5,31 11.5,21 4,14 14,13" fill="#FFD166" stroke="#D97706" stroke-width="2.2" stroke-linejoin="round"/>
            <circle cx="15" cy="16" r="1.5" fill="#5C3D00"/>
            <circle cx="21" cy="16" r="1.5" fill="#5C3D00"/>
            <path d="M15.5 20C16.5 21.5 19.5 21.5 20.5 20" stroke="#5C3D00" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="treat-btn" onclick="selectFavoriteTreat('rainbow', 3)" aria-label="Rainbow">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none">
            <path d="M5 26C5 16 11 9 18 9C25 9 31 16 31 26" stroke="#FF5D73" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M8.5 26C8.5 18 13 12.5 18 12.5C23 12.5 27.5 18 27.5 26" stroke="#FFD166" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M12 26C12 20 14.5 16 18 16C21.5 16 24 20 24 26" stroke="#4CC9F0" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Voyager ZPD 6-Quest Sliding Window Stars + Difficulty Tier Dots -->
      <div class="zpd-star-bar">
        <div id="starSlotsContainer" style="display:flex; gap:6px;"></div>
        <div class="tier-pips" id="tierPipsContainer"></div>
      </div>

      <!-- Gentle Motion & Voice Controls (Snail Default, Pause Clouds, Voice Speaker) -->
      <div class="utility-group">
        <button class="icon-pill-btn active" id="btnVoice" onclick="toggleVoice()" aria-label="Voice">
          <!-- Speaker Icon -->
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2D271D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#FFD166"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <button class="icon-pill-btn active" id="btnGentleMotion" onclick="toggleMotion()" aria-label="Gentle Motion">
          <!-- Cute Snail Icon for 5yo Super-Gentle Motion -->
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
            <path d="M4 24C4 21 8 20 14 20H25C27 20 29 18 29 16C29 14 27 14 26 16L24 20" stroke="#40916C" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="15" cy="14" r="7" fill="#F4A261" stroke="#BC6C25" stroke-width="2.2"/>
            <path d="M15 14C15 12 17 12 17 14C17 16 13 16 13 13" stroke="#BC6C25" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="26" y1="15" x2="28" y2="11" stroke="#40916C" stroke-width="2" stroke-linecap="round"/>
            <circle cx="28" cy="10" r="1.5" fill="#40916C"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- MAIN STAGE: Playable Grid + Cozy Companion Memory Stream -->
    <div class="play-stage">
      <div class="board-frame" id="boardFrame">
        <div class="balloon-layer" id="balloonLayer"></div>
        <div class="grid-board" id="gridBoard"></div>
      </div>

      <!-- Companion Sidebar: SunnyFox (Mom) & PoppyDash (Dad) Memory Stream -->
      <div class="companion-panel">
        <div class="companion-stage">
          <div class="companion-avatars">
            <!-- SunnyFox (Golden-Orange Fox with Glowing Lantern Pendant) -->
            <div class="avatar-circle" onclick="companionCheer()" id="sunnyFoxAvatar">
              <svg width="58" height="58" viewBox="0 0 64 64" fill="none">
                <polygon points="12,26 18,8 28,20" fill="#F77F00" stroke="#9C4100" stroke-width="2.5" stroke-linejoin="round"/>
                <polygon points="52,26 46,8 36,20" fill="#F77F00" stroke="#9C4100" stroke-width="2.5" stroke-linejoin="round"/>
                <circle cx="32" cy="32" r="18" fill="#FCBF49" stroke="#9C4100" stroke-width="2.5"/>
                <path d="M16 34C20 42 26 46 32 46C38 46 44 42 48 34C44 30 38 32 32 32C26 32 20 30 16 34Z" fill="#FFFDF7"/>
                <circle cx="25" cy="29" r="2.6" fill="#2D271D"/>
                <circle cx="39" cy="29" r="2.6" fill="#2D271D"/>
                <circle cx="32" cy="35" r="2.8" fill="#D62828"/>
                <!-- Glowing Lantern Pendant -->
                <circle cx="32" cy="53" r="6" fill="#FFD166" stroke="#D97706" stroke-width="2"/>
                <circle cx="32" cy="53" r="2.5" fill="#FFFDF7"/>
              </svg>
            </div>

            <!-- PoppyDash (Charcoal & White Skunk with Golden Popcorn Pendant) -->
            <div class="avatar-circle" style="border-color: var(--mint);" onclick="companionCheer()">
              <svg width="58" height="58" viewBox="0 0 64 64" fill="none">
                <circle cx="18" cy="18" r="7" fill="#374151" stroke="#1F2937" stroke-width="2.5"/>
                <circle cx="46" cy="18" r="7" fill="#374151" stroke="#1F2937" stroke-width="2.5"/>
                <circle cx="32" cy="32" r="18" fill="#374151" stroke="#1F2937" stroke-width="2.5"/>
                <!-- White Skunk Stripe -->
                <path d="M28 14C30 22 34 22 36 14" fill="#FFFFFF"/>
                <ellipse cx="32" cy="37" rx="11" ry="8" fill="#FFFFFF"/>
                <circle cx="25" cy="29" r="2.5" fill="#FFFFFF"/>
                <circle cx="39" cy="29" r="2.5" fill="#FFFFFF"/>
                <circle cx="32" cy="35" r="2.6" fill="#FF7E6B"/>
                <!-- Golden Popcorn Pendant -->
                <rect x="27" y="48" width="10" height="9" rx="2" fill="#FFD166" stroke="#B45309" stroke-width="2"/>
              </svg>
            </div>
          </div>

          <!-- Pure Visual Thought Bubble: Shows What Companion Remembers + Direction Hint -->
          <div class="thought-bubble" id="thoughtBubble"></div>
        </div>

        <!-- 3-Slot Episodic Memory Stream (Recency + Importance + Relevance) -->
        <div class="memory-stream-tray">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF7E6B"/>
          </svg>
          <div class="memory-slots" id="memorySlots"></div>
        </div>
      </div>
    </div>

    <!-- BOTTOM CONTROLS: Giant D-Pad Arrows + 3 Magic Helper Buttons -->
    <div class="bottom-controls">
      <div class="dpad-cluster">
        <button class="arrow-btn" onclick="stepMove(0, -1)" aria-label="Left">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2D271D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="arrow-btn" onclick="stepMove(-1, 0)" aria-label="Up">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2D271D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <button class="arrow-btn" onclick="stepMove(1, 0)" aria-label="Down">

  // ============================================================================

  // ============================================================================
  // 3. State: Voyager ZPD Sliding Window (W = 6) + Generative Agents Memory Stream
  // ============================================================================
  let favoriteTreat = "strawberry";
  let currentLevelIdx = 0;
  let currentGrid = [];
  let playerPos = { r: 0, c: 0 };
  let goalPos = { r: 0, c: 3 };
  let hintSet = new Set();
  let stepsTakenInLevel = 0;
  let optimalBfsSteps = 4;
  let walkInterval = null;

  // Voyager ZPD State
  let recentOutcomes = [true, true, true]; // 6-slot sliding window
  let estimatedChildSkill = 0.25;

  // Generative Agents Episodic Memory Stream
  // Each node: { iconKey, createdStep, importance, tags }
  let memoryClock = 1;
  let memoryStream = [
    { iconKey: "strawberry", createdStep: 1, importance: 10.0, tags: ["favorite", "treat"] },
    { iconKey: "lunaBat", createdStep: 1, importance: 9.0, tags: ["player", "friend"] },

  let voiceEnabled = true;

  let cloud2X = 62;
  let activeBalloons = [];

  // ============================================================================
  // 4. Web Speech API + WebAudio Gentle Chimes (Zero-Reading Audio Guidance)
  // ============================================================================
  let audioCtx = null;
  function playGentleChime(freqs = [523.25, 659.25]) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, audioCtx.currentTime + idx * 0.11);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + idx * 0.11);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.11 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.11);
        osc.stop(audioCtx.currentTime + idx * 0.11 + 0.36);
      });
    } catch (e) {}
  }

  function speakCozy(phrase) {
    if (!voiceEnabled || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(phrase);
      utter.rate = 0.88; // Gentle, warm storytelling pace for a 5-year-old
      utter.pitch = 1.18;
      window.speechSynthesis.speak(utter);
    } catch (e) {}
  }

  // ============================================================================
  // 5. Companion Memory Stream S-Score Ranking (Park et al., 2023)
  // ============================================================================
  function addCompanionMemory(iconKey, importance, tags) {
    memoryClock += 1;
    memoryStream.push({
      iconKey,
      createdStep: memoryClock,
      importance,
      tags
    });
    renderMemoryTray();
  }

  function retrieveTopMemories(queryTags = ["favorite", "treat"]) {
    const scored = memoryStream.map(m => {
      const recency = Math.pow(0.99, memoryClock - m.createdStep);
      const imp = m.importance / 10.0;
      const overlap = m.tags.filter(t => queryTags.includes(t)).length;
      const relevance = overlap / Math.max(1, queryTags.length);
      const score = 1.0 * recency + 1.2 * imp + 1.5 * relevance;
      return { node: m, score };
    });
    scored.sort((a, b) => b.score - a.score);
    // Deduplicate by iconKey for clean visual display
    const seen = new Set();
    const uniqueTop = [];
    for (const item of scored) {
      if (!seen.has(item.node.iconKey)) {
        seen.add(item.node.iconKey);
        uniqueTop.push(item);
      }
      if (uniqueTop.length === 3) break;
    }
    return uniqueTop;
  }

  function renderMemoryTray() {
    const top = retrieveTopMemories(["favorite", "treat"]);
    const container = document.getElementById("memorySlots");
    container.innerHTML = top.map((item, idx) => `
      <div class="memory-orb ${idx === 0 ? 'top-recalled' : ''}">
        <div style="transform: scale(0.78); display:flex;">${ICONS[item.node.iconKey] || ICONS.starFilled}</div>
      </div>
    `).join("");
  }

  // ============================================================================
  // 6. Deterministic BFS Solver (Shortest Path & Guaranteed Solvability)
  // ============================================================================
  function computeBfsShortestPath(grid, start, goal) {
    const rows = grid.length;
    const cols = grid[0].length;
    const queue = [[start]];
    const visited = new Set([`${start.r},${start.c}`]);

    while (queue.length > 0) {
      const path = queue.shift();
      const curr = path[path.length - 1];
      if (curr.r === goal.r && curr.c === goal.c) {
        return path;
      }
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (const [dr, dc] of dirs) {
        const nr = curr.r + dr;
        const nc = curr.c + dc;
        const key = `${nr},${nc}`;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
          if (grid[nr][nc] !== "#" && !visited.has(key)) {
            visited.add(key);
            queue.push([...path, { r: nr, c: nc }]);
          }
        }
      }
    }
    return [];
  }

  // ============================================================================
  // 7. Voyager ZPD Adaptive Controller (Sliding Window W = 6)
  // ============================================================================
  function getSlidingWindowSolveRate() {
    if (recentOutcomes.length === 0) return 0.75;
    const wins = recentOutcomes.filter(Boolean).length;
    return wins / recentOutcomes.length;
  }

  function selectNextZpdLevelIndex() {
    const solveRate = getSlidingWindowSolveRate();
    if (solveRate > 0.85) {
      estimatedChildSkill = Math.min(0.90, estimatedChildSkill + 0.15);
    } else if (solveRate < 0.60) {
      estimatedChildSkill = Math.max(0.15, estimatedChildSkill - 0.15);
    }
    let bestIdx = 0;
    let bestDiff = 999;
    QUEST_LEVELS.forEach((lvl, idx) => {
      const d = Math.abs(lvl.requiredSkill - estimatedChildSkill);
      if (d < bestDiff) {
        bestDiff = d;
        bestIdx = idx;
      }
    });
    return bestIdx;
  }

  // ============================================================================
  // 8. Board Rendering & Interactive One-Tap Movement
  // ============================================================================
  function loadLevel(idx) {
    if (walkInterval) {
      clearInterval(walkInterval);
      walkInterval = null;
    }
    currentLevelIdx = idx % QUEST_LEVELS.length;
    const lvl = QUEST_LEVELS[currentLevelIdx];
    currentGrid = lvl.grid.map(row => [...row]);
    hintSet.clear();
    stepsTakenInLevel = 0;

    for (let r = 0; r < currentGrid.length; r++) {
      for (let c = 0; c < currentGrid[r].length; c++) {
        if (currentGrid[r][c] === "S") playerPos = { r, c };
        if (currentGrid[r][c] === "G") goalPos = { r, c };
      }
    }

    const bfsPath = computeBfsShortestPath(currentGrid, playerPos, goalPos);
    optimalBfsSteps = Math.max(1, bfsPath.length - 1);

    renderTopIndicators();
    renderBoard();
    renderCompanionThought();
    renderMemoryTray();
  }

  function renderTopIndicators() {
    // 6-Star Sliding Window
    const starContainer = document.getElementById("starSlotsContainer");
    const slots = [];
    for (let i = 0; i < 6; i++) {
      const filled = i < recentOutcomes.length && recentOutcomes[i];
      slots.push(`<div class="star-slot ${filled ? 'filled' : ''}">${filled ? ICONS.starFilled : ICONS.starEmpty}</div>`);
    }
    starContainer.innerHTML = slots.join("");

    // 5-Tier Difficulty Pips
    const tierContainer = document.getElementById("tierPipsContainer");
    const activeTier = QUEST_LEVELS[currentLevelIdx].tier;
    const dots = [];
    for (let t = 1; t <= 5; t++) {
      dots.push(`<div class="tier-dot ${t <= activeTier ? 'active' : ''}"></div>`);
    }
    tierContainer.innerHTML = dots.join("");
  }

  function renderCompanionThought(celebrating = false) {
    const bubble = document.getElementById("thoughtBubble");
    if (celebrating) {
      bubble.innerHTML = `
        ${ICONS.heart}
        ${ICONS[favoriteTreat]}
        ${ICONS.starFilled}
      `;
      return;
    }
    // Find next ideal step direction arrow from BFS
    const path = computeBfsShortestPath(currentGrid, playerPos, goalPos);
    let dirSvg = "";
    if (path.length >= 2) {
      const dr = path[1].r - playerPos.r;
      const dc = path[1].c - playerPos.c;
      let rot = 0;
      if (dr === -1) rot = -90;
      else if (dr === 1) rot = 90;
      else if (dc === -1) rot = 180;
      dirSvg = `
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" style="transform: rotate(${rot}deg);">
          <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="#06D6A0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;
    }
    bubble.innerHTML = `
      ${ICONS[favoriteTreat]}
      ${dirSvg}
    `;
  }

  function renderBoard() {
    const board = document.getElementById("gridBoard");
    board.innerHTML = "";
    for (let r = 0; r < currentGrid.length; r++) {
      const rowEl = document.createElement("div");
      rowEl.className = "grid-row";
      for (let c = 0; c < currentGrid[r].length; c++) {
        const cellEl = document.createElement("div");
        cellEl.className = "tile";
        const key = `${r},${c}`;
        const cellChar = currentGrid[r][c];
        const isPlayer = (r === playerPos.r && c === playerPos.c);
        const isGoal = (r === goalPos.r && c === goalPos.c);
        const isNeighbor = (Math.abs(r - playerPos.r) + Math.abs(c - playerPos.c) === 1) && cellChar !== "#";

        if (cellChar === "#") {
          cellEl.classList.add("tile-wall");
          cellEl.innerHTML = ICONS.bushWall;
        } else if (isPlayer) {
          cellEl.classList.add("tile-player");
          cellEl.innerHTML = ICONS.lunaBat;
        } else if (isGoal) {
          cellEl.classList.add("tile-goal");
          cellEl.innerHTML = ICONS[favoriteTreat];
        } else if (hintSet.has(key)) {
          cellEl.classList.add("tile-hint");
          cellEl.innerHTML = ICONS.pawPrint;
        } else {
          cellEl.innerHTML = ICONS.cloverDot;
        }

        if (isNeighbor) {
          cellEl.classList.add("walkable-neighbor");
        }

        // Direct tap on any reachable tile: if neighbor, step directly; if further, gentle BFS walk!
        cellEl.onclick = () => handleTileTap(r, c);
        rowEl.appendChild(cellEl);
      }
      board.appendChild(rowEl);
    }
  }

  function handleTileTap(targetR, targetC) {
    if (currentGrid[targetR][targetC] === "#") return;
    const dist = Math.abs(targetR - playerPos.r) + Math.abs(targetC - playerPos.c);
    if (dist === 1) {
      stepMove(targetR - playerPos.r, targetC - playerPos.c);
    } else if (dist > 1) {
      walkPathTo({ r: targetR, c: targetC });
    }
  }

  function stepMove(dr, dc) {
    const nr = playerPos.r + dr;
    const nc = playerPos.c + dc;
    if (nr < 0 || nr >= currentGrid.length || nc < 0 || nc >= currentGrid[0].length) return;
    if (currentGrid[nr][nc] === "#") {
      // Gentle low boop when bumping a bush, zero penalty
      playGentleChime([330]);
      return;
    }
    playerPos = { r: nr, c: nc };
    stepsTakenInLevel += 1;
    hintSet.delete(`${nr},${nc}`);
    playGentleChime([523.25]);
    renderBoard();
    renderCompanionThought();
    checkGoalReached();
  }

  function checkGoalReached() {
    if (playerPos.r === goalPos.r && playerPos.c === goalPos.c) {
      if (walkInterval) {
        clearInterval(walkInterval);
        walkInterval = null;
      }
      playGentleChime([523.25, 659.25, 783.99, 1046.5]);

      // Update Voyager ZPD 6-quest sliding window
      // Solved cleanly if without excessive wandering
      const cleanSolve = stepsTakenInLevel <= optimalBfsSteps * 2;
      recentOutcomes.push(cleanSolve);
      if (recentOutcomes.length > 6) recentOutcomes.shift();

      addCompanionMemory(favoriteTreat, 10.0, ["favorite", "treat", "win"]);
      renderTopIndicators();
      renderCompanionThought(true);
      spawnGentleCelebrationBalloons();

      const treatNames = {
        strawberry: "sweet strawberry",
        popcorn: "yummy golden popcorn",
        star: "sparkling star",
        rainbow: "magic rainbow"
      };
      speakCozy(`Yay LunaBat! SunnyFox remembers you love ${treatNames[favoriteTreat]}!`);

      // Automatically transition to next Voyager ZPD level after a calm 2.2s pause
      setTimeout(() => {
        const nextIdx = selectNextZpdLevelIndex();
        // Ensure variety so it advances smoothly
        const chosenIdx = (nextIdx === currentLevelIdx) ? (currentLevelIdx + 1) % QUEST_LEVELS.length : nextIdx;
        loadLevel(chosenIdx);
      }, 2200);
    }
  }

  // ============================================================================
  // 9. Interactive Helpers: Favorite Treat, BFS Sparkle Hint, Auto-Walk
  // ============================================================================
  function selectFavoriteTreat(treatKey, btnIdx) {
    favoriteTreat = treatKey;
    document.querySelectorAll(".treat-btn").forEach((b, i) => {
      b.classList.toggle("selected", i === btnIdx);
    });
    // Store in Generative Agents Companion Memory Stream with Importance = 10/10
    addCompanionMemory(treatKey, 10.0, ["favorite", "treat"]);
    playGentleChime([587.33, 783.99]);
    renderBoard();
    renderCompanionThought();

    const treatSpeech = {
      strawberry: "Yum! SunnyFox remembers you love strawberries!",
      popcorn: "PoppyDash loves golden popcorn too!",
      star: "Twinkle star! Let's go find the star!",
      rainbow: "Rainbow magic! Let's follow the rainbow!"
    };
    speakCozy(treatSpeech[treatKey]);
  }

  function showBfsSparkleHint() {
    const path = computeBfsShortestPath(currentGrid, playerPos, goalPos);
    hintSet.clear();
    for (let i = 1; i < path.length - 1; i++) {
      hintSet.add(`${path[i].r},${path[i].c}`);
    }
    // If child taps hint, Voyager ZPD notes they wanted scaffolding
    recentOutcomes.push(false);
    if (recentOutcomes.length > 6) recentOutcomes.shift();
    playGentleChime([659.25, 783.99]);
    renderTopIndicators();
    renderBoard();
    speakCozy("Follow the golden footprints!");
  }

  function walkPathTo(targetPos) {
    if (walkInterval) clearInterval(walkInterval);
    const path = computeBfsShortestPath(currentGrid, playerPos, targetPos);
    if (path.length < 2) return;
    let idx = 1;
    walkInterval = setInterval(() => {
      if (idx < path.length) {
        playerPos = path[idx];
        stepsTakenInLevel += 1;
        hintSet.delete(`${playerPos.r},${playerPos.c}`);
        playGentleChime([523.25]);
        renderBoard();
        renderCompanionThought();
        checkGoalReached();
        idx++;
      } else {
        clearInterval(walkInterval);
        walkInterval = null;
      }
    }, 420); // Calm, soothing 420ms per step
  }

  function triggerBfsAutoWalk() {
    showBfsSparkleHint();
    walkPathTo(goalPos);
  }

  function advanceZpdQuest() {
    loadLevel((currentLevelIdx + 1) % QUEST_LEVELS.length);
  }

  function companionCheer() {
    playGentleChime([523.25, 659.25, 783.99]);
    speakCozy("You can do it, LunaBat! Tap a green square to hop!");
  }

  function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    document.getElementById("btnVoice").classList.toggle("active", voiceEnabled);
    if (voiceEnabled) speakCozy("Voice on!");
  }

  function toggleMotion() {
    gentleMotionEnabled = !gentleMotionEnabled;
    document.getElementById("btnGentleMotion").classList.toggle("active", gentleMotionEnabled);
  }

  // ============================================================================
  // 10. Ultra-Gentle 5-Year-Old Animation Loop (Clouds <= 0.35 px/f, Balloons <= 0.65 px/f)
  // ============================================================================
  function spawnGentleCelebrationBalloons() {
    if (!gentleMotionEnabled) return;
    const layer = document.getElementById("balloonLayer");
    layer.innerHTML = "";
    const colors = ["#FF7E6B", "#FFD166", "#4CC9F0"];
    activeBalloons = [0, 1, 2].map(i => {
      const el = document.createElement("div");
      el.className = "gentle-balloon";
      const x = 18 + i * 30;
      const y = 320 + i * 25;
      el.style.left = `${x}%`;
      el.innerHTML = `
        <svg width="48" height="64" viewBox="0 0 48 64" fill="none">
          <ellipse cx="24" cy="24" rx="18" ry="21" fill="${colors[i]}" opacity="0.9"/>
          <ellipse cx="18" cy="16" rx="4" ry="7" fill="#FFFFFF" opacity="0.45"/>
          <path d="M24 45Q21 54 25 62" stroke="#9CA3AF" stroke-width="2" fill="none"/>
        </svg>
      `;
      layer.appendChild(el);
      return { el, y, speed: 0.65 }; // Strictly within 0.6-0.8 px/frame gentle rule
    });
  }

  function animateGentleWorld() {
    if (gentleMotionEnabled) {
      cloud1X += 0.025; // ~0.25 px/frame ultra-calm drift
      cloud2X += 0.018;
      if (cloud1X > 105) cloud1X = -15;
      if (cloud2X > 105) cloud2X = -15;
      const c1 = document.getElementById("cloud1");
      const c2 = document.getElementById("cloud2");
      if (c1) c1.style.left = `${cloud1X}%`;
      if (c2) c2.style.left = `${cloud2X}%`;

      activeBalloons.forEach(b => {
        b.y -= b.speed;
        b.el.style.transform = `translateY(${b.y}px)`;
      });
      activeBalloons = activeBalloons.filter(b => b.y > -90);
    }
    requestAnimationFrame(animateGentleWorld);
  }

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowUp") stepMove(-1, 0);
    if (e.key === "ArrowDown") stepMove(1, 0);
    if (e.key === "ArrowLeft") stepMove(0, -1);
    if (e.key === "ArrowRight") stepMove(0, 1);
  });

  // Expose deterministic test hook for verification
  window.__CHILD_GAME__ = {
    stepMove,
    selectFavoriteTreat,
    showBfsSparkleHint,
    triggerBfsAutoWalk,
    getState: () => ({
      playerPos,
      goalPos,
      favoriteTreat,
      currentLevelIdx,
      estimatedChildSkill,
      recentOutcomes,
      topMemories: retrieveTopMemories(["favorite", "treat"])
    })
  };

  loadLevel(0);
  requestAnimationFrame(animateGentleWorld);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>🦇🌙 🪄🌈 🦊🏮 🦨🍿 🐱🌙</title>
  <link rel="icon" href="https://kunruiw1991.github.io/critters-paint-studio/icons/lunabat.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-round: "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      --stroke-choco: #5a3821;
      --cream-soft: #fffdf7;
      --wood-top: #e39d60;
      --wood-mid: #c77b3e;
      --wood-deep: #8f4f1d;
      --clay-shadow: 0 8px 18px rgba(45, 30, 65, 0.16), 0 3px 0 rgba(90, 56, 33, 0.16);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-round);
      background: #7cc4ff;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* ==========================================================================
       DREAMY SUNLIT PASTEL SKY & ULTRA-GENTLE FLOATING CLOUDS (<= 0.35 px/frame)
       ========================================================================== */
    #skyBackdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(
        180deg,
        #64b2ff 0%,
        #9bd4ff 40%,
        #dcf0ff 68%,
        #fff0da 88%,
        #ffe0bd 100%
      );
      transition: background 1.2s ease;
    }

    body.starlightMode #skyBackdrop {
      background: linear-gradient(
        180deg,
        #2b1e58 0%,
        #483285 44%,
        #7454b8 74%,
        #f3c6df 92%,
        #ffe3cc 100%
      );
    }

    .sun-glow-orb {
      position: absolute;
      top: -60px;
      right: 9%;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 250, 215, 0.92) 0%, rgba(255, 224, 130, 0.38) 46%, rgba(255, 224, 130, 0) 72%);
      transition: all 1.2s ease;
    }

    body.starlightMode .sun-glow-orb {
      background: radial-gradient(circle, rgba(255, 244, 180, 0.85) 0%, rgba(185, 148, 255, 0.35) 48%, rgba(185, 148, 255, 0) 74%);
      box-shadow: 0 0 80px rgba(255, 230, 140, 0.45);
    }

    .cloud-cluster {
      position: absolute;
      filter: drop-shadow(0 12px 22px rgba(55, 85, 135, 0.14));
      transition: opacity 0.8s ease;
      will-change: transform;
    }

    .cloud-left {
      top: 11%;
      left: 2%;
      width: clamp(200px, 22vw, 320px);
    }

    .cloud-right {
      top: 10%;
      right: 3%;
      width: clamp(210px, 23vw, 340px);
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 2;
      cursor: pointer;
    }

    /* ==========================================================================
       FLOATING 3D WORLD THOUGHT BUBBLES & MEMORY HEARTS OVERLAY
       ========================================================================== */
    #worldOverlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .npc-thought-bubble {
      position: absolute;
      transform: translate(-50%, -100%);
      background: rgba(255, 253, 247, 0.96);
      border: 3px solid #f3d9fa;
      border-radius: 26px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 22px;
      box-shadow: 0 8px 18px rgba(45, 30, 65, 0.18), 0 3px 0 rgba(140, 95, 190, 0.22);
      transition: transform 0.25s ease, border-color 0.3s ease;
      pointer-events: auto;
      cursor: pointer;
    }

    .npc-thought-bubble::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 9px 8px 0;
      border-style: solid;
      border-color: rgba(255, 253, 247, 0.96) transparent transparent;
    }

    .npc-thought-bubble.remembered {
      border-color: #ffd43b;
      background: linear-gradient(180deg, #fffdf7 0%, #fff9db 100%);
      box-shadow: 0 8px 20px rgba(245, 159, 0, 0.28), 0 3px 0 rgba(230, 119, 0, 0.28);
    }

    /* Slow Celebration Balloons (Max 3, 0.6-0.8 px/frame anti-dizziness rule) */
    .party-balloon {
      position: absolute;
      font-size: 46px;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.15));
      pointer-events: none;
      will-change: transform;
    }

    /* ==========================================================================
       FLOATING PUFFY CLAYMORPHISM TOP HUD (100% ZERO TEXT)
       ========================================================================== */
    #topBar {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
      pointer-events: none;
    }

    .hud-left,
    .hud-center,
    .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-left {
      flex-wrap: wrap;
      max-width: 34vw;
    }

    /* Generative Agents Companion Memory Stream Capsules */
    .memory-capsule {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px 5px 6px;
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.96);
      border: 3px solid #ffe066;
      box-shadow: var(--clay-shadow);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.25s ease;
    }

    .memory-capsule:hover,
    .memory-capsule:active {
      transform: scale(1.05);
    }

    .memory-capsule.fox-cap { border-color: #ffa94d; }
    .memory-capsule.skunk-cap { border-color: #74c0fc; }
    .memory-capsule.cat-cap { border-color: #b197fc; }

    .critter-badge-svg {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fffdf7;
      border: 2.5px solid #e9d8fd;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .mem-slots {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mem-slot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff9db;
      border: 2px dashed #ffd43b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mem-slot.filled {
      border-style: solid;
      border-color: #fcc419;
      background: linear-gradient(180deg, #fffdf7 0%, #fff3bf 100%);
      transform: scale(1.08);
      box-shadow: 0 3px 8px rgba(245, 159, 0, 0.25);
    }

    /* Center Floating Hero: Voyager ZPD Quest Shrine & Stage Medallions */
    .hud-center {
      flex-direction: column;
      gap: 6px;
    }

    .stage-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 253, 247, 0.92);
      padding: 4px 10px;
      border-radius: 999px;
      border: 3px solid #ffe066;
      box-shadow: var(--clay-shadow);
    }

    .stage-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #e9ecef;
      background: #fffdf7;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s ease;
    }

    .stage-btn.active {
      background: linear-gradient(180deg, #ffe066 0%, #fcc419 100%);
      border-color: #f59f00;
      transform: scale(1.12);
      box-shadow: 0 4px 10px rgba(245, 159, 0, 0.35);
    }

    .stage-btn.completed {
      background: #d3f9d8;
      border-color: #51cf66;
    }

    .quest-shrine-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 253, 247, 0.96);
      border: 3.5px solid #fcc419;
      border-radius: 999px;
      padding: 6px 16px;
      box-shadow: var(--clay-shadow);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .quest-shrine-wrap:active {
      transform: scale(0.96);
    }

    .quest-step-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 24px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #fff9db;
      border: 2px solid transparent;
      transition: all 0.25s ease;
    }

    .quest-step-pill.active {
      background: linear-gradient(180deg, #fff3bf 0%, #ffe066 100%);
      border-color: #f59f00;
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(245, 159, 0, 0.28);
    }

    .quest-step-pill.done {
      background: #d3f9d8;
      border-color: #51cf66;
    }

    .quest-arrow {
      font-size: 18px;
      color: #f59f00;
    }

    /* Right Floating Cluster: Star Counter + Tactile Toy Controls */
    .star-capsule {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.96);
      border: 3px solid #ffd43b;
      box-shadow: var(--clay-shadow);
      font-size: 22px;
      font-weight: 900;
      color: #5a3821;
    }

    .control-pebbles {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid #fffdf7;
      background: linear-gradient(180deg, #fffdf7 0%, #f8f0fc 100%);
      box-shadow: var(--clay-shadow);
      font-size: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-btn:hover {
      transform: translateY(-2px) scale(1.06);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn.guide-pill {
      background: linear-gradient(180deg, #ffe066 0%, #fcc419 100%);
      border-color: #fff9db;
    }

    .icon-btn.dice-pill {
      background: linear-gradient(180deg, #e5dbff 0%, #b197fc 100%);
      border-color: #fffdf7;
    }

    .icon-btn.active-toggle {
      background: linear-gradient(180deg, #d3f9d8 0%, #69db7c 100%);
    }

    /* ==========================================================================
       MAGIC COLOR & CROWN MINI DRAWER (OPENS ABOVE DOCK WHEN PAINT SKILL ACTIVE)
       ========================================================================== */
    #paintDrawer {
      position: absolute;
      bottom: 118px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.96);
      border: 3px solid #d0bfff;
      box-shadow: var(--clay-shadow);
      z-index: 22;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #paintDrawer.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(14px) scale(0.92);
    }

    .swatch-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid #fffdf7;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease;
    }

    .swatch-btn.selected {
      transform: scale(1.2);
      border-color: #5a3821;
      box-shadow: 0 0 0 3px #ffe066, 0 6px 12px rgba(0,0,0,0.22);
    }

    /* ==========================================================================
       COZY SCULPTED HONEY-WOOD & CREAM VOYAGER SKILL TOY-BOX SHELF (ZERO TEXT)
       ========================================================================== */
    #bottomDock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .wood-toybox-frame {
      pointer-events: auto;
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, var(--wood-top) 0%, var(--wood-mid) 65%, var(--wood-deep) 100%);
      border: 4px solid #6b3911;
      border-radius: 34px;
      padding: 8px 14px 11px;
      box-shadow: 0 14px 28px rgba(35, 20, 10, 0.28), inset 0 3px 0 rgba(255, 235, 205, 0.55);
    }

    .cream-shelf-well {
      background: var(--cream-soft);
      border-radius: 26px;
      padding: 7px 12px;
      border: 3px solid #b06527;
      box-shadow: inset 0 4px 8px rgba(140, 80, 30, 0.15);
    }

    .hotbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skill-card {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 22px;
      border: 3.5px solid #e9d8fd;
      background: linear-gradient(180deg, #fffdf7 0%, #f8f0fc 100%);
      box-shadow: 0 6px 0 #d0bfff, 0 8px 16px rgba(45, 30, 65, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, border-color 0.2s ease;
    }

    .skill-card:hover {
      transform: translateY(-4px) scale(1.05);
    }

    .skill-card:active {
      transform: translateY(2px) scale(0.95);
    }

    .skill-card.selected {
      border-color: #f59f00;
      background: linear-gradient(180deg, #fff9db 0%, #ffe066 100%);
      box-shadow: 0 6px 0 #e67700, 0 0 18px rgba(255, 212, 59, 0.75);
      transform: translateY(-6px) scale(1.08);
    }

    .skill-card.recommended::before {
      content: "✨";
      position: absolute;
      top: -12px;
      right: -8px;
      font-size: 20px;
      animation: gentlePulse 1.8s ease-in-out infinite;
    }

    .skill-main-ico {
      font-size: 32px;
      line-height: 1;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.12));
    }

    .skill-sub-badge {
      position: absolute;
      bottom: -6px;
      right: -5px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fffdf7;
      border: 2px solid #fcc419;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.14); opacity: 1; }
    }

    /* ==========================================================================
       PURE-ICON FLOATING FEEDBACK BUBBLE & VICTORY MODAL (ZERO TEXT)
       ========================================================================== */
    .bubble {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 253, 247, 0.98);
      border: 3.5px solid #ffd43b;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 30px;
      box-shadow: var(--clay-shadow);
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .bubble.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px) scale(0.9);
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(35, 20, 60, 0.42);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      background: linear-gradient(180deg, #fffdf7 0%, #fff4e6 100%);
      border: 5px solid #ffd43b;
      border-radius: 38px;
      padding: 26px 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 48px rgba(25, 12, 45, 0.35);
      transform: scale(1);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-stars {
      font-size: 40px;
      letter-spacing: 8px;
    }

    .modal-hero-row {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 46px;
    }

    .modal-btn-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .big-play-btn {
      width: 86px;
      height: 64px;
      border-radius: 22px;
      border: 3.5px solid #fffdf7;
      background: linear-gradient(180deg, #69db7c 0%, #37b24d 100%);
      box-shadow: 0 6px 0 #2b8a3e, 0 10px 20px rgba(0,0,0,0.2);
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease;
    }

    .big-play-btn:active {
      transform: translateY(3px) scale(0.95);
    }

    @media (max-width: 760px) {
      .skill-card { width: 56px; height: 56px; border-radius: 18px; }
      .skill-main-ico { font-size: 26px; }
      .icon-btn { width: 40px; height: 40px; font-size: 19px; }
      .quest-step-pill { font-size: 19px; padding: 2px 7px; }
      .memory-capsule { padding: 4px 8px 4px 4px; }
      .critter-badge-svg { width: 30px; height: 30px; }
      .mem-slot { width: 24px; height: 24px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Dreamy Sunlit Pastel Sky & Fluffy Cumulus Clouds -->
    <div id="skyBackdrop" aria-hidden="true">
      <div class="sun-glow-orb"></div>
      <svg id="cloudLeft" class="cloud-cluster cloud-left" viewBox="0 0 360 220">
        <defs>
          <linearGradient id="cGradL" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="70%" stop-color="#fff5eb" />
            <stop offset="100%" stop-color="#ebd8d0" />
          </linearGradient>
        </defs>
        <path d="M20 185 Q10 135 55 125 Q70 75 130 85 Q175 45 230 85 Q285 80 305 125 Q345 135 335 185 Z" fill="url(#cGradL)" />
      </svg>
      <svg id="cloudRight" class="cloud-cluster cloud-right" viewBox="0 0 380 230">
        <defs>
          <linearGradient id="cGradR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="70%" stop-color="#fff4e6" />
            <stop offset="100%" stop-color="#edd6c8" />
          </linearGradient>
        </defs>
        <path d="M30 195 Q15 145 65 132 Q85 80 148 90 Q195 42 255 86 Q315 78 335 132 Q370 145 358 195 Z" fill="url(#cGradR)" />
      </svg>
    </div>

    <!-- Full-Screen 3D Three.js Plush Island World -->
    <canvas id="gameCanvas"></canvas>

    <!-- 2D Projected Companion Thought Bubbles & Gentle Celebration Balloons -->
    <div id="worldOverlay">
      <div id="thoughtSunny" class="npc-thought-bubble" data-npc="sunnyfox">💭 🍓</div>
      <div id="thoughtPoppy" class="npc-thought-bubble" data-npc="poppydash">💭 🌈</div>
      <div id="thoughtCatnap" class="npc-thought-bubble" data-npc="catnap">💭 🎵</div>
    </div>

    <!-- Floating Puffy Claymorphism Top HUD (100% Zero Text) -->
    <header id="topBar">
      <!-- Left: Generative Agents Companion Memory Stream Capsules (SunnyFox, PoppyDash, CatNap) -->
      <div class="hud-left">
        <div class="memory-capsule fox-cap" id="memCapSunny" data-npc="sunnyfox">
          <div class="critter-badge-svg" id="badgeSunny"></div>
          <div class="mem-slots" id="memSlotsSunny">
            <span class="mem-slot">🤍</span>
            <span class="mem-slot">🤍</span>
            <span class="mem-slot">🤍</span>
          </div>
        </div>

        <div class="memory-capsule skunk-cap" id="memCapPoppy" data-npc="poppydash">
          <div class="critter-badge-svg" id="badgePoppy"></div>
          <div class="mem-slots" id="memSlotsPoppy">
            <span class="mem-slot">🤍</span>
            <span class="mem-slot">🤍</span>
            <span class="mem-slot">🤍</span>
          </div>
        </div>

        <div class="memory-capsule cat-cap" id="memCapCatnap" data-npc="catnap">
          <div class="critter-badge-svg" id="badgeCatnap"></div>
          <div class="mem-slots" id="memSlotsCatnap">
            <span class="mem-slot">🤍</span>
            <span class="mem-slot">🤍</span>
            <span class="mem-slot">🤍</span>
          </div>
        </div>
      </div>

      <!-- Center: Voyager ZPD Adaptive Quest Shrine (5 Stages, Pure Visual Recipe) -->
      <div class="hud-center">
        <div id="stageBar" class="stage-bar">
          <button class="stage-btn active" data-stage="0">1️⃣</button>
          <button class="stage-btn" data-stage="1">2️⃣</button>
          <button class="stage-btn" data-stage="2">3️⃣</button>
          <button class="stage-btn" data-stage="3">4️⃣</button>
          <button class="stage-btn" data-stage="4">5️⃣</button>
        </div>

        <div id="questShrine" class="quest-shrine-wrap">

    // =========================================================================
    // 2. SOOTHING WEBAUDIO CHIMES & HUNTR/X GOLDEN-STYLE MUSIC BOX
    // =========================================================================
    let audioCtx = null;
    let musicOn = true;
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playChime(freqs, dur = 0.16, wave = 'sine', vol = 0.10) {
      if (!musicOn) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(f, now + i * 0.075);
        gain.gain.setValueAtTime(0.001, now + i * 0.075);
        gain.gain.exponentialRampToValueAtTime(vol, now + i * 0.075 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.075 + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.075);
        osc.stop(now + i * 0.075 + dur + 0.02);
      });
    }

    function playGoldenMelody() {

    // =========================================================================

    // =========================================================================
    let _cachedPlushBump = null;
    let _cachedDiamondQuilt = null;

    function createPlushBumpTexture(size = 128) {
      if (_cachedPlushBump) return _cachedPlushBump;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, size, size);
      let seed = 1337;
      const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      for (let i = 0; i < 1200; i++) {
        const x = rand() * size, y = rand() * size;
        const sh = Math.floor(95 + rand() * 130);
        ctx.strokeStyle = `rgb(${sh},${sh},${sh})`;
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (rand() - 0.5) * 4, y + 3 + rand() * 3);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      _cachedPlushBump = tex;
      return tex;
    }

    function createDiamondQuiltTexture(baseHex = '#9f78d9', seamHex = '#563694', size = 128) {
      if (_cachedDiamondQuilt) return _cachedDiamondQuilt;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, size, size);
      ctx.strokeStyle = seamHex;
      ctx.lineWidth = 2.4;
      ctx.setLineDash([4, 3]);
      for (let off = -size; off <= size * 2; off += 24) {
        ctx.beginPath(); ctx.moveTo(off, 0); ctx.lineTo(off + size, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(off, size); ctx.lineTo(off + size, 0); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      _cachedDiamondQuilt = tex;
      return tex;
    }

    function createPlushMaterial(hexColor, extra = {}) {
      return new THREE.MeshStandardMaterial({

        bumpMap: createPlushBumpTexture(),

          { id: 'feast_all', icon: '🍿🍓', skill: 'popcorn_party', targetPos: new THREE.Vector3(0.0, 0.08, -0.6), done: false },
          { id: 'grand_concert', icon: '🎵💃', skill: 'golden_concert', targetPos: new THREE.Vector3(0.0, 0.08, -0.8), done: false }
        ]

    ];

    // Generative Agents Memory Stream (S = alpha * Recency + beta * Importance + gamma * Relevance)
    const companionMemories = {
      sunnyfox: [],
      poppydash: [],
      catnap: []
    };

    function recordCompanionMemory(npcId, icon, importance = 9, relevance = 1.0) {
      const list = companionMemories[npcId];
      if (!list) return;
      // Compute retrieval score S = Recency + Importance + Relevance
      const entry = {
        icon,
        importance,
        relevance,
        timestamp: performance.now(),
        score: 1.0 + (importance / 10) + relevance
      };
      // Deduplicate by icon while boosting score
      const existing = list.find(m => m.icon === icon);
      if (existing) {
        existing.timestamp = performance.now();
        existing.score = 1.0 + (importance / 10) + relevance + 0.25;
      } else {
        list.unshift(entry);
      }
      // Sort by Generative Agents Retrieval Score (keeping top 3 high-importance memories!)
      list.sort((a, b) => b.score - a.score);
      if (list.length > 3) list.length = 3;
      renderMemoryCapsules();
    }

    function renderMemoryCapsules() {
      const mapping = [
        ['sunnyfox', 'memSlotsSunny', 'thoughtSunny', '💭 🍓'],
        ['poppydash', 'memSlotsPoppy', 'thoughtPoppy', '💭 🌈'],
        ['catnap', 'memSlotsCatnap', 'thoughtCatnap', '💭 🎵']
      ];
      mapping.forEach(([npcId, slotContainerId, thoughtId, defaultThought]) => {
        const container = document.getElementById(slotContainerId);
        const list = companionMemories[npcId];
        if (container) {
          container.innerHTML = [0, 1, 2].map(idx => {
            const m = list[idx];
            return m
              ? `<span class="mem-slot filled">${m.icon}</span>`
              : `<span class="mem-slot">🤍</span>`;
          }).join('');
        }
        const thoughtEl = document.getElementById(thoughtId);
        if (thoughtEl) {
          if (list.length > 0) {
            thoughtEl.textContent = `💖 ${list[0].icon}`;
            thoughtEl.classList.add('remembered');
          } else {
            thoughtEl.textContent = defaultThought;
            thoughtEl.classList.remove('remembered');
          }
        }
      });
    }

      selectedColor: '#9775fa',
      bridgeBuilt: false,
      crystalsAwake: false,

      concertTimer: 0,

      paused: false,

    function showToast(icons) {
      const b = document.getElementById('bubble');
      b.textContent = icons;
      b.classList.remove('hidden');

    function updateQuestUI() {
      const stage = ZPD_STAGES[state.stageIdx];
      document.querySelectorAll('#stageBar .stage-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === state.stageIdx);
        btn.classList.toggle('completed', idx < state.stageIdx);
      });

      const row = document.getElementById('questStepsRow');
      const firstUndoneIdx = stage.steps.findIndex(s => !s.done);
      row.innerHTML = stage.steps.map((st, i) => {
        const cls = st.done ? 'done' : (i === firstUndoneIdx ? 'active' : '');
        const arrow = i < stage.steps.length - 1 ? `<span class="quest-arrow">➔</span>` : '';
        return `<div class="quest-step-pill ${cls}">${st.done ? '✅' : ''}${st.icon}</div>${arrow}`;
      }).join('');

      // Highlight recommended Voyager skill card on bottom dock
      const activeStep = stage.steps[firstUndoneIdx];
      document.querySelectorAll('#hotbar .skill-card').forEach(card => {
        card.classList.toggle('recommended', !!activeStep && card.dataset.skill === activeStep.skill);

      state.stars += n;
      document.getElementById('starCount').textContent = String(state.stars);
    }

    function checkQuestProgress(skillUsed) {
      const stage = ZPD_STAGES[state.stageIdx];
      if (!stage) return;
      const activeStep = stage.steps.find(s => !s.done);
      if (!activeStep) return;

      if (activeStep.skill === skillUsed) {
        activeStep.done = true;
        addStars(2);
        playChime([587.33, 783.99, 1046.50], 0.2, 'triangle', 0.12);
        updateQuestUI();

        if (stage.steps.every(s => s.done)) {

          playGoldenMelody();

              state.stageIdx += 1;

              updateQuestUI();

        m.material.color.set(col);
      });
      spawnBurst3D(cottageGroup.position, new THREE.Color(hexStr).getHex(), 16, 'star');
      playChime([523.25, 659.25, 880, 1046.50], 0.18, 'sine', 0.11);

      const emojiMap = {
        '#9775fa': '🟣',
        '#ff8787': '🩷',
        '#ffd43b': '🟡',
        '#69db7c': '🟢',
        '#74c0fc': '🔵',

    // =========================================================================
    // 8. RAYCASTING (TAP ANYWHERE ON 3D ISLAND) & UI EVENT WIRING
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.08);

    canvas.addEventListener('pointerdown', (e) => {
      ensureAudio();
      const rect = canvas.getBoundingClientRect();
      pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);

      const hitPoint = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
        // Clamp within island radius
        hitPoint.x = clamp(hitPoint.x, -6.2, 6.4);
        hitPoint.z = clamp(hitPoint.z, -4.6, 3.6);
        // If trying to cross river (x > 2.0) before bridge is built and not flying, auto-build Rainbow Bridge or glide!
        if (hitPoint.x > 2.0 && !state.bridgeBuilt) {
          executeVoyagerSkill('rainbow_bridge', false);
        }
        state.lunaTarget.set(hitPoint.x, 0.08, hitPoint.z);
        tapRing.position.set(hitPoint.x, 0.14, hitPoint.z);
        tapRing.material.opacity = 0.9;
        playChime([523.25, 659.25], 0.10, 'sine', 0.07);

        // If tapped near a landmark, trigger its skill automatically upon arrival!
        if (hitPoint.distanceTo(cottageGroup.position) < 2.1) {
          state.pendingAutoSkill = 'magic_paint';
        } else if (hitPoint.distanceTo(popcornCartGroup.position) < 2.2) {
          state.pendingAutoSkill = 'popcorn_party';
        } else if (hitPoint.distanceTo(crystalGroveGroup.position) < 2.1) {
          state.pendingAutoSkill = 'lantern_beam';
        } else if (hitPoint.distanceTo(stageGroup.position) < 2.0) {
          state.pendingAutoSkill = 'golden_concert';
        }

    // Tapping Companion Capsules or Thought Bubbles interacts with that companion

    // =========================================================================
    // 9. ULTRA-GENTLE 60 FPS ANIMATION LOOP (10x-15x SLOWER ANTI-DIZZINESS PACING)
    // =========================================================================
    let cloudOffset = 0;
    let lastTime = performance.now();

    function projectToScreen(pos3D, yOffset = 1.65) {
      const v = pos3D.clone();
      v.y += yOffset;
      v.project(camera);
      return {
        x: (v.x * 0.5 + 0.5) * window.innerWidth,
        y: (-(v.y * 0.5) + 0.5) * window.innerHeight
      };
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      const t = now * 0.001;
      const motionScale = state.paused ? 0 : 0.45; // Ultra-gentle 5yo pacing

      // 1. Gentle Cloud Drift (<= 0.22 px/frame, well under 0.35 px/frame limit)
      if (!state.paused) {
        cloudOffset = (cloudOffset + 0.18) % 60;
        const cl = document.getElementById('cloudLeft');
        const cr = document.getElementById('cloudRight');
        if (cl) cl.style.transform = `translateX(${Math.sin(t * 0.25) * 14}px)`;
        if (cr) cr.style.transform = `translateX(${Math.cos(t * 0.22) * -14}px)`;
      }

      // 2. Smooth LunaBat Movement & Quilted Wing Flap
      const toTarget = new THREE.Vector3().subVectors(state.lunaTarget, lunaBat.position);
      toTarget.y = 0;
      const dist = toTarget.length();
      if (dist > 0.06) {
        const moveStep = Math.min(dist, 2.3 * dt * (state.paused ? 0.5 : 1.0));
        toTarget.normalize();
        lunaBat.position.x += toTarget.x * moveStep;
        lunaBat.position.z += toTarget.z * moveStep;
        const targetAngle = Math.atan2(toTarget.x, toTarget.z);
        lunaBat.rotation.y += (targetAngle - lunaBat.rotation.y) * 0.14;
        state.lunaHopPhase += dt * 7.0;
        lunaBat.position.y = 0.08 + Math.abs(Math.sin(state.lunaHopPhase)) * 0.24 + (state.lunaFlying > 0 ? 0.55 : 0);
      } else {
        lunaBat.position.y = 0.08 + Math.sin(t * 2.2) * 0.04 + (state.lunaFlying > 0 ? 0.45 : 0);
        if (state.pendingAutoSkill) {
          const sk = state.pendingAutoSkill;
          state.pendingAutoSkill = null;
          executeVoyagerSkill(sk, false);
        }
      }

      if (state.lunaFlying > 0) {
        state.lunaFlying = Math.max(0, state.lunaFlying - dt * 0.6);
      }

      const wingAngle = Math.sin(t * (state.lunaFlying > 0 ? 9.0 : 3.2)) * (state.lunaFlying > 0 ? 0.42 : 0.16);
      lunaBat.userData.leftWing.rotation.y = wingAngle;
      lunaBat.userData.rightWing.rotation.y = -wingAngle;

      // 3. Collectible Strawberries Gentle Bob & Pickup
      strawberries.forEach(b => {
        if (!b.collected) {
          b.group.position.y = b.basePos.y + Math.sin(t * 2.4 + b.phase) * 0.07 * motionScale;
          b.group.rotation.y += dt * 0.8 * motionScale;
          if (lunaBat.position.distanceTo(b.basePos) < 0.85) {
            b.collected = true;
            b.respawnTimer = 6.0;
            b.group.visible = false;
            addStars(1);
            spawnBurst3D(b.basePos, 0xff4d6d, 8, 'star');
            playChime([659.25, 880, 1046.50], 0.14, 'sine', 0.09);
            checkQuestProgress('wing_hop');
          }
        } else {
          b.respawnTimer -= dt;
          if (b.respawnTimer <= 0) {
            b.collected = false;
            b.group.visible = true;
          }
        }
      });

      // 4. Generative Agents Companion Schedules & Concert Gathering
      if (state.concertActive) {
        state.concertTimer -= dt;
        // SunnyFox & PoppyDash gather around CatNap's stage and dance!
        const sunnyGoal = new THREE.Vector3(-1.2, 0.08, -0.9);
        const poppyGoal = new THREE.Vector3(1.2, 0.08, -0.9);
        sunnyFox.position.lerp(sunnyGoal, dt * 1.8);
        poppyDash.position.lerp(poppyGoal, dt * 1.8);
        [lunaBat, sunnyFox, poppyDash, catNap].forEach((c, idx) => {
          c.position.y = (c === catNap ? 0.24 : 0.08) + Math.abs(Math.sin(t * 4.5 + idx)) * 0.22 * motionScale;
          c.rotation.y = Math.sin(t * 2.8 + idx) * 0.45;
        });
        stagePetals.forEach((p, idx) => {
          p.material.emissiveIntensity = 0.5 + 0.45 * Math.sin(t * 5.0 + idx);
        });
        if (state.concertTimer <= 0) state.concertActive = false;
      } else {
        // Calm idle breathing & gentle looking toward LunaBat
        const sunnyHome = new THREE.Vector3(-3.2 + Math.sin(t * 0.5) * 0.35 * motionScale, 0.08, -1.2 + Math.cos(t * 0.4) * 0.25 * motionScale);
        sunnyFox.position.lerp(sunnyHome, dt * 1.5);
        sunnyFox.lookAt(lunaBat.position.x, sunnyFox.position.y, lunaBat.position.z);

        // If bridge is built, PoppyDash happily strolls across the bridge to visit!
        const poppyHome = state.bridgeBuilt
          ? new THREE.Vector3(3.2 + Math.sin(t * 0.55) * 0.8 * motionScale, 0.08, -0.5)
          : new THREE.Vector3(4.5 + Math.sin(t * 0.5) * 0.3 * motionScale, 0.08, -0.4);
        poppyDash.position.lerp(poppyHome, dt * 1.5);
        poppyDash.lookAt(lunaBat.position.x, poppyDash.position.y, lunaBat.position.z);

        catNap.position.y = 0.24 + Math.sin(t * 2.0) * 0.04 * motionScale;
        catNap.lookAt(lunaBat.position.x, catNap.position.y, lunaBat.position.z);
      }

      // 5. 3D BFS Starlight Trail Leading from LunaBat to Current ZPD Quest Target
      const stage = ZPD_STAGES[state.stageIdx];
      const activeStep = stage ? stage.steps.find(s => !s.done) : null;
      trailStars.forEach((st, idx) => {
        if (activeStep) {
          const frac = (idx + 1) / (trailStars.length + 1);
          st.position.lerpVectors(lunaBat.position, activeStep.targetPos, frac);
          st.position.y = 0.22 + Math.sin(t * 3.2 - idx * 0.6) * 0.08 * motionScale;
          st.rotation.y = t * 1.5 + idx;
          st.visible = true;
        } else {
          st.visible = false;
        }
      });

      // 6. Update 3D Burst Particles
      for (let i = particles3D.length - 1; i >= 0; i--) {
        const p = particles3D[i];
        p.life -= dt;
        if (p.life <= 0) {
          worldGroup.remove(p.mesh);
          particles3D.splice(i, 1);
        } else {
          p.mesh.position.x += p.vx * dt;
          p.mesh.position.y += p.vy * dt;
          p.mesh.position.z += p.vz * dt;
          p.vy -= 4.8 * dt;
          if (p.mesh.position.y < 0.15) {
            p.mesh.position.y = 0.15;
            p.vy = Math.abs(p.vy) * 0.45;
          }
          p.mesh.rotation.x += dt * 3;
          p.mesh.rotation.y += dt * 3;
          p.mesh.scale.setScalar(clamp(p.life, 0.01, 1));
        }
      }

      if (tapRing.material.opacity > 0.01) {
        tapRing.material.opacity = Math.max(0, tapRing.material.opacity - dt * 0.9);
      }

      // 7. Gentle Camera Follow
      const desiredCamPos = state.cameraZoomed
        ? new THREE.Vector3(lunaBat.position.x * 0.55, 5.6, lunaBat.position.z * 0.55 + 7.8)
        : new THREE.Vector3(lunaBat.position.x * 0.28, 8.8, 12.6);
      camera.position.lerp(desiredCamPos, dt * 2.2);
      camera.lookAt(lunaBat.position.x * 0.35, 0.5, lunaBat.position.z * 0.25 - 0.6);

      // 8. Project 2D Companion Thought Bubbles above SunnyFox, PoppyDash, CatNap
      const pairs = [
        [sunnyFox, 'thoughtSunny'],
        [poppyDash, 'thoughtPoppy'],
        [catNap, 'thoughtCatnap']
      ];
      pairs.forEach(([npc, domId]) => {
        const el = document.getElementById(domId);
        if (el) {
          const sc = projectToScreen(npc.position, 1.78);
          el.style.left = `${sc.x}px`;
          el.style.top = `${sc.y}px`;
        }
      });

      // 9. Update Slow Floating Celebration Balloons (0.6-0.8 px/frame)
      for (let i = activeBalloons.length - 1; i >= 0; i--) {
        const b = activeBalloons[i];
        if (!state.paused) {
          b.y -= b.vy;
        }
        b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
        if (b.y < -80) {
          b.el.remove();
          activeBalloons.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);
    onResize();
    updateQuestUI();
    renderMemoryCapsules();
    requestAnimationFrame(animate);

    // Expose Automated Verification & Gameplay State Hook
    window.__VOYAGER_GAME__ = {
      getState: () => ({
        stageIdx: state.stageIdx,
        stars: state.stars,
        activeSkill: state.activeSkill,
        bridgeBuilt: state.bridgeBuilt,
        crystalsAwake: state.crystalsAwake,
        concertActive: state.concertActive,
        lunaPos: { x: Number(lunaBat.position.x.toFixed(2)), z: Number(lunaBat.position.z.toFixed(2)) },
        memories: {
          sunnyfox: companionMemories.sunnyfox.map(m => m.icon),
          poppydash: companionMemories.poppydash.map(m => m.icon),
          catnap: companionMemories.catnap.map(m => m.icon)
        },
        questSteps: ZPD_STAGES[state.stageIdx].steps.map(s => ({ id: s.id, done: s.done }))
      }),
      useSkill: (skillId) => executeVoyagerSkill(skillId, true),
      autoGuideStep: () => triggerAutoGuideStep(),
      paintColor: (c) => { state.selectedColor = c; applyMagicPaintOrCrown(c); }
    };
  })();
  </script>
</body>
</html>

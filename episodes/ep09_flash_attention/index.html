<script>
  const PLATES = [
    // PLATE I: THE GPU MEMORY WALL & STANDARD ATTENTION IO PATHOLOGY
    `
    <div class="math-plate">
      <div>
        <div class="plate-running-head">
          <span>MONOGRAPH SERIES IN DEEP LEARNING SYSTEMS</span>
          <span>ARXIV:2205.14135 &bull; PLATE I / VII</span>
        </div>
        <div class="plate-title-block">
          <div class="plate-section-tag">&sect;1. GPU Memory Hierarchy &amp; The IO Wall</div>
          <div class="plate-main-title">The Memory Bandwidth Wall &amp; IO Pathology of Standard Attention</div>
          <div class="plate-authors">Tri Dao, Daniel Y. Fu, Stefano Ermon, Atri Rudra, Christopher R&eacute; (NeurIPS 2022)</div>
        </div>

        <div class="math-env def">
          <span class="env-head">Definition 1.1 (GPU Two-Tier Memory Space).</span>
          <span class="env-body">Let an accelerator compute unit possess fast SRAM of capacity M words with bandwidth bw_SRAM, and slow High Bandwidth Memory (HBM) with capacity C_HBM &gg; M and bandwidth bw_HBM. On an NVIDIA A100 GPU:</span>
          <div class="eq-block">
            <span>M &approx; 192\text{ KB/SM}, \quad \text{bw}_{\text{SRAM}} &approx; 19.0\text{ TB/s}, \quad \text{bw}_{\text{HBM}} &approx; 1.555\text{ TB/s}</span>
            <span class="eq-num">(1.1)</span>
          </div>
          <span class="env-body roman">The accelerator operates in a 12.2&times; bandwidth asymmetry regime. Arithmetic intensity is bounded by FLOPS / HBM Bytes.</span>
        </div>

        <div class="math-env thm">
          <span class="env-head">Theorem 1.2 (Standard Attention IO Complexity &amp; Memory Pathology).</span>
          <span class="env-body">Let Q, K, V &in; &reals;^{N &times; d}. Standard scaled dot-product attention computes S = Q K^T / &radic;d, P = \text{softmax}(S), and O = P V by writing and reading intermediate matrices S, P &in; &reals;^{N &times; N} to/from HBM:</span>
          <div class="eq-block">
            <span>\text{IO}_{\text{standard}} = \Theta(N d + N^2) \text{ HBM transfers}, \quad \text{Memory}_{\text{peak}} = \Theta(N^2 + N d)</span>
            <span class="eq-num">(1.2)</span>
          </div>
        </div>

        <div class="math-env proof">
          <span class="env-head">Proof.</span>
          <span class="env-body roman">Materializing S requires writing N^2 elements to HBM; softmax reads S and writes P (2N^2 elements); computing O reads P and V (N^2 + Nd elements). Thus total HBM transfers equal 4N^2 + 4Nd elements, which scales quadratically in sequence length N. For N &gg; d, memory access time completely dwarfs matrix multiplication FLOPs, bounding arithmetic intensity to &OElig;(1) FLOP/Byte. <span class="qed">&FilledSmallSquare;</span></span>
        </div>

        <table class="booktabs">
          <thead>
            <tr>
              <th>Operation</th>
              <th>FLOP Count</th>
              <th>HBM Read/Write</th>
              <th>Arithmetic Intensity</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>S = Q K^T / &radic;d</td>
              <td>2 N^2 d</td>
              <td>Read 2Nd, Write N^2</td>
              <td>2d / (1 + 2d/N)</td>
            </tr>
            <tr>
              <td>P = softmax(S)</td>
              <td>3 N^2</td>
              <td>Read N^2, Write N^2</td>
              <td>1.5 FLOP/Byte</td>
            </tr>
            <tr>
              <td>O = P V</td>
              <td>2 N^2 d</td>
              <td>Read N^2 + Nd, Write Nd</td>
              <td>2d / (1 + 2d/N)</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="plate-footer">
        <span>Citation: Dao et al. (2022), arXiv:2205.14135, &sect;1&ndash;&sect;2</span>
        <span>Page 1 of 7</span>
      </div>
    </div>
    `,

    // PLATE II: MATHEMATICAL FOUNDATIONS OF ONLINE SOFTMAX
    `
    <div class="math-plate">
      <div>
        <div class="plate-running-head">
          <span>FLASHATTENTION &bull; EXACT NUMERICAL ANALYSIS</span>
          <span>ARXIV:2205.14135 &bull; PLATE II / VII</span>
        </div>
        <div class="plate-title-block">
          <div class="plate-section-tag">&sect;2. Numerical Softmax Decompositions</div>
          <div class="plate-main-title">Online Incremental Softmax without N&times;N Materialization</div>
        </div>

        <div class="math-env def">
          <span class="env-head">Definition 2.1 (Two-Pass Safe Softmax).</span>
          <span class="env-body">For vector x = [x_1, ..., x_B] &in; &reals;^B, the numerically stable softmax is defined via global maximum m(x) = \max_i x_i and normalizer l(x) = \sum_i e^{x_i - m(x)}:</span>
          <div class="eq-block">
            <span>m(x) := \max_{1 \le i \le B} x_i, \quad l(x) := \sum_{i=1}^B e^{x_i - m(x)}, \quad \text{softmax}(x)_i := \frac{e^{x_i - m(x)}}{l(x)}</span>
            <span class="eq-num">(2.1)</span>
          </div>
        </div>

        <div class="math-env thm">
          <span class="env-head">Theorem 2.2 (Online Softmax Merge Identity, Milakov &amp; Gimelshein 2018).</span>
          <span class="env-body">Let x = [x^{(1)}, x^{(2)}] &in; &reals;^{B_1 + B_2} be partitioned into two sub-vectors with statistics (m_1, l_1) and (m_2, l_2). Then the merged maximum m and normalizer l satisfy the exact recursive identities:</span>
          <div class="eq-block">
            <span>m_{\text{new}} = \max(m_1, m_2), \quad l_{\text{new}} = e^{m_1 - m_{\text{new}}} l_1 + e^{m_2 - m_{\text{new}}} l_2</span>
            <span class="eq-num">(2.2)</span>
          </div>
        </div>

        <div class="math-env proof">
          <span class="env-head">Proof of Output Vector Rescaling.</span>
          <span class="env-body roman">Let unnormalized accumulator O_1 = \sum_{j \in B_1} e^{x_j - m_1} V_j and O_2 = \sum_{j \in B_2} e^{x_j - m_2} V_j. When updating to global scale m_{\text{new}}:
          O_{\text{new}} = e^{m_1 - m_{\text{new}}} O_1 + e^{m_2 - m_{\text{new}}} O_2.
          Normalizing by l_{\text{new}}^{-1} yields \frac{O_{\text{new}}}{l_{\text{new}}} = \sum_{j \in B_1 \cup B_2} \frac{e^{x_j - m_{\text{new}}}}{l_{\text{new}}} V_j = \text{softmax}(x) V.
          The output is identical to single-pass softmax to machine precision. <span class="qed">&FilledSmallSquare;</span></span>
        </div>

        <table class="booktabs">
          <thead>
            <tr>
              <th>Statistic</th>
              <th>Local Block j</th>
              <th>Running Prior (j-1)</th>
              <th>Merged State (1..j)</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Max m_i</td>
              <td>m^{(j)} = \max S_{i, j}</td>
              <td>m_i^{(j-1)}</td>
              <td>\max(m_i^{(j-1)}, m^{(j)})</td>
            </tr>
            <tr>
              <td>Sum l_i</td>
              <td>l^{(j)} = \sum e^{S_{i, j} - m^{(j)}}</td>
              <td>l_i^{(j-1)}</td>
              <td>e^{m_i^{(j-1)} - m_i} l_i^{(j-1)} + e^{m^{(j)} - m_i} l^{(j)}</td>
            </tr>
            <tr>
              <td>Accumulator O_i</td>
              <td>\sum e^{S_{i, j} - m^{(j)}} V_j</td>
              <td>O_i^{(j-1)}</td>
              <td>e^{m_i^{(j-1)} - m_i} O_i^{(j-1)} + e^{m^{(j)} - m_i} O^{(j)}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="plate-footer">
        <span>Citation: Dao et al. (2022), arXiv:2205.14135, &sect;3.1 (Algorithm 1)</span>
        <span>Page 2 of 7</span>
      </div>
    </div>
    `,

    // PLATE III: TILING ALGORITHM & SRAM BUFFER ARCHITECTURE
    `
    <div class="math-plate">
      <div>
        <div class="plate-running-head">
          <span>FLASHATTENTION &bull; ALGORITHM SPECIFICATION</span>
          <span>ARXIV:2205.14135 &bull; PLATE III / VII</span>
        </div>
        <div class="plate-title-block">
          <div class="plate-section-tag">&sect;3. Tiling Architecture &amp; Execution Schedule</div>
          <div class="plate-main-title">Two-Level Memory Tiling: Block Sizes &amp; SRAM Fitting</div>
        </div>

        <div class="math-env def">
          <span class="env-head">Definition 3.1 (Optimal Block Size Constraints).</span>
          <span class="env-body">Given on-chip SRAM of capacity M words, we choose row block size B_r and column block size B_c such that one block of Q (B_r &times; d), K (B_c &times; d), V (B_c &times; d), and scores S (B_r &times; B_c) fit concurrently in SRAM:</span>
          <div class="eq-block">
            <span>B_c = \left\lceil \frac{M}{4d} \right\rceil, \quad B_r = \min\left( \left\lceil \frac{M}{4d} \right\rceil, d \right)</span>
            <span class="eq-num">(3.1)</span>
          </div>
        </div>

        <div class="math-env thm">
          <span class="env-head">Proposition 3.2 (Outer Loop Key-Value Reuse Schedule).</span>
          <span class="env-body">By scheduling the outer loop over K, V blocks (j = 1, ..., T_c) and inner loop over Q blocks (i = 1, ..., T_r), each K_j, V_j block is loaded from HBM exactly ONCE into SRAM:</span>
          <div class="eq-block">
            <span>T_c = \left\lceil \frac{N}{B_c} \right\rceil, \quad T_r = \left\lceil \frac{N}{B_r} \right\rceil</span>
            <span class="eq-num">(3.2)</span>
          </div>
        </div>

        <div class="math-env proof">
          <span class="env-head">Execution Trace Algorithm 1 (Forward Pass).</span>
          <div class="env-body roman" style="font-size:10px; line-height:1.32;">
            1. Initialize O = zeros(N, d), l = zeros(N), m = [-&infin;]*N in HBM.<br>
            2. For j = 1 to T_c: Load K_j, V_j from HBM to SRAM.<br>
            3. &nbsp;&nbsp; For i = 1 to T_r: Load Q_i, O_i, l_i, m_i from HBM to SRAM.<br>
            4. &nbsp;&nbsp;&nbsp;&nbsp; Compute S_ij = Q_i K_j^T / &radic;d &in; &reals;^{B_r &times; B_c} in SRAM.<br>
            5. &nbsp;&nbsp;&nbsp;&nbsp; Compute rowmax m_ij and rowsum l_ij.<br>
            6. &nbsp;&nbsp;&nbsp;&nbsp; Update m_i^{new} = \max(m_i, m_ij), l_i^{new} = e^{m_i - m_i^{new}} l_i + e^{m_ij - m_i^{new}} l_ij.<br>
            7. &nbsp;&nbsp;&nbsp;&nbsp; Update O_i = \text{diag}(e^{m_i - m_i^{new}}) O_i + e^{S_ij - m_i^{new}} V_j.<br>
            8. &nbsp;&nbsp;&nbsp;&nbsp; Write O_i, l_i, m_i back to HBM.<br>
            9. Return O = \text{diag}(l)^{-1} O. <span class="qed">&FilledSmallSquare;</span>
          </div>
        </div>

        <table class="booktabs">
          <thead>
            <tr>
              <th>Tensor</th>
              <th>Dimensions</th>
              <th>Storage Location</th>
              <th>Access Pattern</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Q_i</td>
              <td>B_r &times; d</td>
              <td>SRAM Buffer</td>
              <td>Loaded T_c times</td>
            </tr>
            <tr>
              <td>K_j, V_j</td>
              <td>B_c &times; d</td>
              <td>SRAM Buffer</td>
              <td>Loaded 1 time (outer loop)</td>
            </tr>
            <tr>
              <td>S_ij</td>
              <td>B_r &times; B_c</td>
              <td>SRAM Registers</td>
              <td>Never leaves on-chip SRAM!</td>
            </tr>
            <tr>
              <td>O_i</td>
              <td>B_r &times; d</td>
              <td>HBM Accumulator</td>
              <td>Incrementally updated</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="plate-footer">
        <span>Citation: Dao et al. (2022), arXiv:2205.14135, &sect;3.2</span>
        <span>Page 3 of 7</span>
      </div>
    </div>
    `,

    // PLATE IV: IO COMPLEXITY THEOREM & LOWER BOUND
    `
    <div class="math-plate">
      <div>
        <div class="plate-running-head">
          <span>FLASHATTENTION &bull; THEORETICAL IO COMPLEXITY</span>
          <span>ARXIV:2205.14135 &bull; PLATE IV / VII</span>
        </div>
        <div class="plate-title-block">
          <div class="plate-section-tag">&sect;4. Asymptotic IO Bounds &amp; Hong-Kung Analogy</div>
          <div class="plate-main-title">IO Complexity Theorem &amp; Hong-Kung Lower Bound</div>
        </div>

        <div class="math-env thm">
          <span class="env-head">Theorem 4.1 (FlashAttention IO Complexity, Theorem 1 in Dao et al.).</span>
          <span class="env-body">Let N denote sequence length, d head dimension, and M fast SRAM size with d &le; M &le; Nd. FlashAttention computes exact attention with total HBM accesses:</span>
          <div class="eq-block">
            <span>\text{IO}_{\text{Flash}} = \Theta\left( \frac{N^2 d^2}{M} \right) \text{ HBM transfers}</span>
            <span class="eq-num">(4.1)</span>
          </div>
        </div>

        <div class="math-env proof">
          <span class="env-head">Proof of Upper Bound.</span>
          <span class="env-body roman">With block size B_c = \Theta(M/d), number of blocks is T_c = \Theta(Nd/M). Each outer iteration loads K_j, V_j once (size 2 B_c d) and sweeps all Q blocks of size N d. Total transfers across all T_c iterations:
          \text{Total IO} = T_c \cdot (N d) + 2 N d = \Theta\left( \frac{N d}{M} \cdot N d \right) = \Theta\left( \frac{N^2 d^2}{M} \right).
          Compared to standard attention's \Theta(N^2), FlashAttention reduces HBM traffic by a factor of \Theta(M / d^2). For typical parameters (d=64, M=10^5 words), this achieves a 10&times; to 25&times; reduction in memory traffic. <span class="qed">&FilledSmallSquare;</span></span>
        </div>

        <div class="math-env thm">
          <span class="env-head">Theorem 4.2 (IO Lower Bound, Hong-Kung Theorem Analogy).</span>
          <span class="env-body">For any algorithm computing attention Q K^T V that partitions computation over SRAM of size M without knowledge of data sparsity, HBM IO is lower bounded by:</span>
          <div class="eq-block">

  let currentPlateIndex = 0;

  function renderPlate(idx) {
    currentPlateIndex = idx;
    const viewport = document.getElementById('activePlateViewport');
    viewport.innerHTML = \`<div class="plate-card-wrapper">\${PLATES[idx]}</div>\`;
    updateSelectorUI();
  }

  function updateSelectorUI() {
    const selector = document.getElementById('plateSelectorButtons');
    selector.innerHTML = '';
    PLATES.forEach((_, i) => {
      const btn = document.createElement('button');
      btn.className = 'academic-btn';
      btn.innerText = \`Plate \${i+1}\`;
      if (i === currentPlateIndex) {
        btn.style.background = 'var(--ink)';
        btn.style.color = 'var(--parchment)';
      }
      btn.onclick = () => renderPlate(i);
      selector.appendChild(btn);
    });
  }

  // Initial render
  const urlParams = new URLSearchParams(window.location.search);
  const cardParam = urlParams.get('card');
  if (cardParam && !isNaN(parseInt(cardParam))) {
    const idx = Math.max(0, Math.min(PLATES.length - 1, parseInt(cardParam) - 1));
    document.body.style.padding = '0';
    document.body.style.margin = '0';
    document.body.style.width = '540px';
    document.body.style.height = '720px';
    document.body.style.overflow = 'hidden';

  } else {

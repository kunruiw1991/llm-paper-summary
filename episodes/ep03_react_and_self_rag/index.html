  <script>
    const PLATES = [
      // PLATE I: THE PARAMETRIC VS EXTERNAL MEMORY DILEMMA & RETRIEVAL POLLUTION
      `
      <div class="math-plate" id="plate-1">
        <div>
          <div class="plate-running-head">
            <span>VOL. III: REACT &amp; SELF-RAG · THE PARAMETRIC KNOWLEDGE DILEMMA</span>
            <span>ARXIV:2210.03629 / ARXIV:2310.11511 · PLATE I / VII</span>
          </div>
          <div class="plate-title-block">
            <div class="plate-section-tag">§1.0 · Foundational Setting &amp; Failure Modes</div>
            <div class="plate-main-title">Parametric Memory Limits &amp; Naive Retrieval Degradation</div>
            <div class="plate-authors">S. Yao et al. (Princeton / Google Brain) &amp; A. Asai et al. (Univ. Washington / Allen AI)</div>
          </div>

          <div class="math-env def">
            <span class="env-head">Definition 1.1 (Parametric vs. Non-Parametric Information Duality).</span>
            <span class="env-body roman">Let M_θ denote an autoregressive language model with static parameters θ ∈ ℝ^d, and let D = {d_1, d_2, ..., d_N} denote an open-world external document corpus. The conditional distribution over sequence y given query x satisfies P(y | x) = P_θ(y | x, D) where retrieval is parameterized by an external mapping R : X → P(D).</span>
          </div>

          <div class="math-env thm">
            <span class="env-head">Proposition 1.2 (Pathologies of Naive Always-On RAG).</span>
            <span class="env-body roman">Standard Naive RAG fixes R(x) = TopK_sim(x, D) uniformly for all queries x ∈ X, inducing three systemic vulnerabilities:</span>
            <div class="eq-block">
              <span>R_naive(x) = {d_(1), ..., d_(k)}, &nbsp;&nbsp; ∀ x ∈ X &nbsp; (Unconditional Retrieval)</span>
              <span class="eq-num">(Eq. 1.1)</span>
            </div>
            <span class="env-body roman">
              1. <b>Adversarial Distractor Poisoning</b>: When max_i Sim(x, d_i) selects an irrelevant or adversarial passage d_adv, unconditional conditioning forces P_θ(y | x, d_adv) to amplify spurious premises.<br/>
              2. <b>Parametric Redundancy Tax</b>: When x requires invariant factual or mathematical deduction already in θ (e.g. O(N^2) complexity), R_naive wastes latency and adds context clutter.<br/>
              3. <b>Multi-Hop Disconnection</b>: Single-shot retrieval fails when answering x requires a compositional chain d_1 → a_1 → d_2 → y.
            </span>
          </div>

          <table class="booktabs">
            <thead>
              <tr>
                <th>Retrieval Paradigm</th>
                <th>Decision Boundary</th>
                <th>Reasoning Horizon</th>
                <th>Grounding Verification</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Vanilla No-RAG</td>
                <td>Zero (None)</td>
                <td>Parametric CoT only</td>
                <td>None (Unchecked Hallucination)</td>
              </tr>
              <tr>
                <td>Naive Always-On RAG</td>
                <td>Static Step 0</td>
                <td>Single-hop Top-K</td>
                <td>None (Vulnerable to Distractors)</td>
              </tr>
              <tr>
                <td><b>ReAct (Yao et al.)</b></td>
                <td><b>Interleaved Actions</b></td>
                <td><b>Dynamic Multi-Hop</b></td>
                <td><b>Trace Observation Consistency</b></td>
              </tr>
              <tr>
                <td><b>Self-RAG (Asai et al.)</b></td>
                <td><b>Adaptive [Retrieve]</b></td>
                <td><b>Segment-Level Gated</b></td>
                <td><b>Explicit [IsRel] &amp; [IsSup] Tokens</b></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="plate-footer">
          <span>Citation: Yao et al. (2022), arXiv:2210.03629; Asai et al. (2023), arXiv:2310.11511</span>
          <span>Page 1 of 7</span>
        </div>
      </div>
      `,

      // PLATE II: REACT FORMALISM — POMDP AUGMENTED ACTION SPACE
      `
      <div class="math-plate" id="plate-2">
        <div>
          <div class="plate-running-head">
            <span>REACT FORMALISM · INTERLEAVING REASONING &amp; EXTERNAL ACTING</span>
            <span>ARXIV:2210.03629 · PLATE II / VII</span>
          </div>
          <div class="plate-title-block">
            <div class="plate-section-tag">§2.0 · POMDP with Thought-Action Augmentation</div>
            <div class="plate-main-title">ReAct: Augmented Action Space &amp; Dynamic Traces</div>
          </div>

          <div class="math-env def">
            <span class="env-head">Definition 2.1 (Partially Observable Markov Decision Process Setup).</span>
            <span class="env-body roman">Consider an interactive environment with state space S, observation space O, external action space A_env, and transition dynamics T : S × A_env → P(S). The agent receives query x and observation o_t = O(s_t), but cannot observe latent true world state s_t.</span>
          </div>

          <div class="math-env def">
            <span class="env-head">Definition 2.2 (Augmented Action Space A_aug = A_env ∪ L_thought).</span>
            <span class="env-body roman">ReAct augments the action space with an unbounded linguistic reasoning space L_thought. At step t:</span>
            <div class="eq-block">
              <span>a_t ∈ A_aug = A_env ∪ L_thought</span>
              <span class="eq-num">(Eq. 2.1)</span>
            </div>
            <span class="env-body roman">
              • If a_t = thought_t ∈ L_thought, the environment state is frozen (s_(t+1) = s_t), and observation o_(t+1) = ∅. Thought updates the agent's internal working context.<br/>
              • If a_t ∈ A_env (e.g., Search[entity], Lookup[keyword], Finish[ans]), the environment executes the action and returns observation o_(t+1) ~ O(s_(t+1)).
            </span>
          </div>

          <div class="math-env thm">
            <span class="env-head">Theorem 2.3 (Synergistic Error Correction in ReAct Traces).</span>
            <span class="env-body roman">Let P_err(CoT) denote the probability of compounding reasoning errors in ungrounded Chain-of-Thought, and P_err(Act) denote the failure rate of unreasoned action execution. ReAct bounds the error rate via mutual grounding:</span>
            <div class="eq-block">
              <span>c_t = (x, a_1, o_1, ..., a_(t-1), o_(t-1)), &nbsp;&nbsp; a_t ~ π_θ(· | c_t)</span>
              <span class="eq-num">(Eq. 2.2)</span>
            </div>
            <span class="env-body roman">External observations o_k prune hallucinated branch trajectories in L_thought, while thoughts t_k eliminate aimless exploratory sampling in A_env. <span class="qed">∎</span></span>
          </div>
        </div>
        <div class="plate-footer">
          <span>Citation: Yao et al., "ReAct: Synergizing Reasoning and Acting in Language Models", ICLR 2023</span>
          <span>Page 2 of 7</span>
        </div>
      </div>
      `,

      // PLATE III: SELF-RAG FORMALISM — THE 4 REFLECTION TOKEN FAMILIES
      `
      <div class="math-plate" id="plate-3">
        <div>
          <div class="plate-running-head">
            <span>SELF-RAG ARCHITECTURE · ADAPTIVE REFLECTION TOKENS</span>
            <span>ARXIV:2310.11511 · PLATE III / VII</span>
          </div>
          <div class="plate-title-block">
            <div class="plate-section-tag">§3.0 · Reflection Token Taxonomy &amp; Generator Training</div>
            <div class="plate-main-title">Self-RAG: Reflection Token Taxonomy &amp; Supervision</div>
          </div>

          <div class="math-env def">
            <span class="env-head">Definition 3.1 (Reflection Token Vocabulary Extension Γ).</span>
            <span class="env-body roman">Self-RAG extends the base vocabulary V with special reflection tokens: V_aug = V ∪ Γ_ret ∪ Γ_rel ∪ Γ_sup ∪ Γ_use:</span>
            <div class="eq-block">
              <span>Γ = { [Retrieve], [IsRel], [IsSup], [IsUse] }</span>
              <span class="eq-num">(Eq. 3.1)</span>
            </div>
          </div>

          <table class="booktabs">
            <thead>
              <tr>
                <th>Reflection Family</th>
                <th>Token Realizations</th>
                <th>Mathematical Role &amp; Gating Mechanism</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><b>Retrieval Gating (Γ_ret)</b></td>
                <td><code>[Retrieve:Yes]</code>, <code>[Retrieve:No]</code>, <code>[Retrieve:Continue]</code></td>
                <td>Triggered at segment boundary; decides whether to invoke retriever R(x).</td>
              </tr>
              <tr>
                <td><b>Document Relevance (Γ_rel)</b></td>
                <td><code>[IsRel:Relevant]</code>, <code>[IsRel:Irrelevant]</code></td>
                <td>Evaluates whether document d provides relevant context for prompt x.</td>
              </tr>
              <tr>
                <td><b>Grounding Support (Γ_sup)</b></td>
                <td><code>[IsSup:FullySupported]</code>, <code>[IsSup:Partially]</code>, <code>[IsSup:NoSupport]</code></td>
                <td>Verifies whether generated output segment y_t is strictly entailed by d.</td>
              </tr>
              <tr>
                <td><b>Utility Quality (Γ_use)</b></td>
                <td><code>[IsUse:1]</code>, <code>[IsUse:2]</code>, <code>[IsUse:3]</code>, <code>[IsUse:4]</code>, <code>[IsUse:5]</code></td>
                <td>Assesses overall informativeness, truthfulness, and utility of response.</td>
              </tr>
            </tbody>
          </table>

          <div class="math-env thm" style="margin-bottom:0;">
            <span class="env-head">Proposition 3.2 (Dual-Model Critic-Generator Distillation).</span>
            <span class="env-body roman">Self-RAG trains a specialized Critic Model C to label reflection tokens on corpus D_train, then distills C into the Generator M via standard supervised fine-tuning:</span>
            <div class="eq-block">
              <span>L_SFT(θ) = - ∑_{(x, y)} ∑_{t=1}^{|y|} log P_θ(y_t | x, y_{&lt;t})</span>
              <span class="eq-num">(Eq. 3.2)</span>
            </div>
            <span class="env-body roman">This allows M to generate both target tokens and critique tokens end-to-end without auxiliary inference networks. <span class="qed">∎</span></span>
          </div>
        </div>
        <div class="plate-footer">
          <span>Citation: Asai et al., "Self-RAG: Learning to Retrieve, Generate, and Critique", ICLR 2024</span>
          <span>Page 3 of 7</span>
        </div>
      </div>
      `,

      // PLATE IV: SEGMENT-LEVEL BEAM SEARCH & CRITIQUE SCORING
      `
      <div class="math-plate" id="plate-4">
        <div>
          <div class="plate-running-head">
            <span>SELF-RAG INFERENCE · SEGMENT BEAM SEARCH &amp; CRITIQUE SCORING</span>
            <span>ARXIV:2310.11511 · PLATE IV / VII</span>
          </div>
          <div class="plate-title-block">
            <div class="plate-section-tag">§3.2 · Segment-Level Decoding Formulation</div>
            <div class="plate-main-title">Segment-Level Beam Search &amp; Multi-Reward Formulation</div>
          </div>

          <div class="math-env def">
            <span class="env-head">Definition 4.1 (Segment-Level Generation Step).</span>
            <span class="env-body roman">The response y is partitioned into T segments (e.g. sentences) y = [y_1, y_2, ..., y_T]. At segment t, the model emits token r_t ∈ Γ_ret. If r_t = [Retrieve:Yes], the model queries retriever R(x, y_{&lt;t}) to obtain K candidate passages {d_1, ..., d_K}.</span>
          </div>

          <div class="math-env thm">
            <span class="env-head">Theorem 4.2 (Critique-Regularized Beam Score Functional, Eq. 4 of Asai et al.).</span>
            <span class="env-body roman">Each candidate continuation segment y_t generated conditioned on passage d_k is scored by combining generation likelihood with critique token rewards:</span>
            <div class="eq-block" style="font-size:9.8px;">
              <span>Score(y_t, d_k) = (1/|y_t|) ∑_{i} log P_θ(y_{t,i} | x, y_{&lt;t}, d_k) + γ_rel P([IsRel:Rel]) + γ_sup P([IsSup:Full]) + γ_use P([IsUse:5])</span>
              <span class="eq-num">(Eq. 4.1)</span>
            </div>
          </div>

          <div class="math-env proof" style="margin-bottom:0;">
            <span class="env-head">Proof (Hallucination Suppression via Support Thresholding).</span>
            <span class="env-body roman">Let τ_sup ∈ (0, 1] denote the strictness threshold. If P([IsSup:NoSupport] | x, y_{&lt;t}, d_k, y_t) &gt; 1 - τ_sup, the segment is assigned score -∞ and pruned from the beam. Consequently, the decoded sequence y^* = argmax_y ∏_{t=1}^T Score(y_t, d^*) satisfies:</span>
            <div class="eq-block">
              <span>P(Hallucination | y^*) ≤ ∏_{t=1}^T (1 - P([IsSup:Full])) ⟶ 0</span>
              <span class="eq-num">(Bound 4.2)</span>
            </div>
            <span class="env-body roman">as the support threshold τ_sup → 1. <span class="qed">∎</span></span>
          </div>
        </div>
        <div class="plate-footer">
          <span>Citation: Asai et al., "Self-RAG: Learning to Retrieve, Generate, and Critique", ICLR 2024, §3.2</span>
          <span>Page 4 of 7</span>
        </div>
      </div>
      `,

      // PLATE V: ADVERSARIAL DISTRACTORS & MULTI-HOP GROUNDING VERIFICATION
      `
      <div class="math-plate" id="plate-5">
        <div>
          <div class="plate-running-head">
            <span>EMPIRICAL VERIFICATION · ADVERSARIAL DISTRACTOR IMMUNITY</span>
            <span>XMANAGER XM/292337037 · PLATE V / VII</span>
          </div>
          <div class="plate-title-block">
            <div class="plate-section-tag">§4.0 · Robustness under Adversarial Poisoning</div>
            <div class="plate-main-title">Multi-Hop Deduction &amp; Adversarial Distractor Immunity</div>
          </div>

          <div class="math-env thm">
            <span class="env-head">Proposition 5.1 (Asymmetric Distractor Susceptibility).</span>
            <span class="env-body roman">Consider an adversarial document d_adv crafted with high lexical overlap to query x but containing an inverted factual claim y_false. Under Naive RAG:</span>
            <div class="eq-block">
              <span>P_naive(y_false | x) = P_θ(y_false | x, d_adv) ≫ 0 &nbsp; (Catastrophic Poisoning)</span>
              <span class="eq-num">(Prop. 5.1)</span>
            </div>
            <span class="env-body roman">Under Self-RAG, the support classifier detects the discrepancy against parametric world knowledge and uncorrupted documents:</span>
